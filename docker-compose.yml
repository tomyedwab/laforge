networks:
  gitea:
    external: false

volumes:
  logs:

services:
  gitea:
    image: docker.gitea.com/gitea:1.25.4
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
    networks:
      - gitea
    volumes:
      - ~/.laforge/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3010:3000"
      - "222:22"
    healthcheck:
      test: curl -fSs localhost:3000/api/v1/version || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    networks:
      - gitea
    command:
      - serve
    environment:
      - TZ=America/Los_Angeles
    user: "1000:1000"
    volumes:
      - ~/.laforge/ntfy-cache:/var/cache/ntfy
      - ~/.laforge/ntfy-config:/etc/ntfy
    ports:
      - "3031:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - gitea
    command: redis-server --appendonly yes
    volumes:
      - ~/.laforge/redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: orchestrator
    networks:
      - gitea
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.laforge/config.yaml:/etc/laforge/config.yaml:ro
      - logs:/logs
    environment:
      - CONFIG_FILE=/etc/laforge/config.yaml
    depends_on:
      - redis
      - gitea
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:8080/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  viewer:
    build:
      context: ./viewer
      dockerfile: Dockerfile
    container_name: viewer
    networks:
      - gitea
    volumes:
      - logs:/logs
      - ~/.laforge/viewer-data:/data
    ports:
      - "8082:8082"
    restart: unless-stopped
